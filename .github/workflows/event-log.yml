name: Event log verification

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'test/**'
      - 'db/**'
      - 'idl/**'
      - 'coordinator/**'
      - 'gatewayd/**'
      - 'sdk/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/event-log.yml'
  push:
    paths:
      - 'engine/**'
      - 'test/**'
      - 'db/**'
      - 'idl/**'
      - 'coordinator/**'
      - 'gatewayd/**'
      - 'sdk/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/event-log.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flory
          POSTGRES_USER: flory
          POSTGRES_PASSWORD: flory-dev-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flory -d flory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            coordinator/go.sum
            gatewayd/go.sum
      # Started as a step rather than a service container, because the emulator needs
      # arguments and a service container can only pass `docker create` flags.
      # -public-host must match STORAGE_EMULATOR_HOST below: when it does not, writes
      # land and reads resolve to nothing, which looks like an empty bucket.
      - name: Start the storage emulator
        run: |
          docker run -d --rm -p 4443:4443 --name fake-gcs fsouza/fake-gcs-server:1.55.0 \
            -scheme http -public-host localhost:4443
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:4443/storage/v1/b >/dev/null && break
            sleep 1
          done
      - run: npm ci
      - run: npm run db:setup
      # Run the Coordinator integration suite before the storage suite creates
      # unrelated ready work in the shared CI database. ProcessOne intentionally
      # claims globally, so its scenario database must begin with an empty queue.
      - name: Verify the Distributed Transaction Coordinator
        working-directory: coordinator
        env:
          FLORY_INTEGRATION: '1'
          ENGINE_DATABASE_URL: postgresql://engine_role:engine-dev-password@127.0.0.1:5432/flory
          COORDINATOR_DATABASE_URL: postgresql://coordinator_role:coordinator-dev-password@127.0.0.1:5432/flory
        run: go vet ./... && go test -race ./...
      - run: npm run verify
      - name: Verify the Tool Registry Gateway
        working-directory: gatewayd
        env:
          STORAGE_EMULATOR_HOST: http://localhost:4443
          GATEWAYD_BLOB_BUCKET: flory-tool-views
        run: go vet ./... && go test -race ./...
      # The end-to-end suite runs against a live topology: the gateway in front of
      # four tool services that register themselves through the SDK.
      - name: Verify the gateway-mediated topology
        env:
          STORAGE_EMULATOR_HOST: http://localhost:4443
          GATEWAYD_BLOB_BACKEND: gcs
          GATEWAYD_BLOB_BUCKET: flory-tool-views
          GATEWAY_BASE_URL: http://127.0.0.1:8092
        run: |
          npm run e2e:up &
          expected_tool_count=$(node -p "require('./test/fixtures/tool-view-ecommerce.json').tools.length")
          for attempt in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8092/v1/tool-view | grep -Eq "\"tool_count\":${expected_tool_count}"; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8092/v1/tool-view | grep -Eq "\"tool_count\":${expected_tool_count}"
          npx vitest run test/conformance/gateway-e2e.test.ts
