name: Event log verification

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'test/**'
      - 'db/**'
      - 'idl/**'
      - 'coordinator/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/event-log.yml'
  push:
    paths:
      - 'engine/**'
      - 'test/**'
      - 'db/**'
      - 'idl/**'
      - 'coordinator/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/event-log.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flory
          POSTGRES_USER: flory
          POSTGRES_PASSWORD: flory-dev-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flory -d flory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: coordinator/go.sum
      - run: npm ci
      - run: npm run db:setup
      - run: npm run verify
      - name: Verify the Distributed Transaction Coordinator
        working-directory: coordinator
        env:
          FLORY_INTEGRATION: '1'
          ENGINE_DATABASE_URL: postgresql://engine_role:engine-dev-password@127.0.0.1:5432/flory
          COORDINATOR_DATABASE_URL: postgresql://coordinator_role:coordinator-dev-password@127.0.0.1:5432/flory
        run: go vet ./... && go test -race ./...
