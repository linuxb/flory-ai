# Generates the gatewayd south-side stubs for both SDK languages from one source.
# Run through `npm run generate`; `npm run generate:check` fails on stale output.
version: v2
inputs:
  - directory: idl/proto
plugins:
  - local: gatewayd/bin/protoc-gen-go
    out: gatewayd/internal/pb
    opt: paths=source_relative
  - local: gatewayd/bin/protoc-gen-go-grpc
    out: gatewayd/internal/pb
    opt: paths=source_relative
  - local: node_modules/.bin/protoc-gen-es
    out: sdk/typescript/gen
    opt:
      - target=ts
      - import_extension=.js
