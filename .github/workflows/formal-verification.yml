name: Formal verification

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/formal-verification.yml'
      - 'spec/**'
      - 'doc/design/**'
      - 'doc/plan/plan-001-tla-plus-specification.md'
  push:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/formal-verification.yml'
      - 'spec/**'
      - 'doc/design/**'
      - 'doc/plan/plan-001-tla-plus-specification.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc:
    name: TLC S1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install PDF export toolchain
        run: |
          if ! command -v pdflatex >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended
          fi
      - name: Check the transaction protocol
        run: ./spec/run-tlc.sh
      - name: Upload verified TLA+ specification PDF
        uses: actions/upload-artifact@v4
        with:
          name: flory-tla-specification-pdf
          path: spec/output/FloryTxn.pdf
          if-no-files-found: error
          retention-days: 14
