name: Event log verification

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'test/**'
      - 'db/**'
      - 'idl/**'
      - 'coordinator/internal/eventlog/generated/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/event-log.yml'
  push:
    paths:
      - 'engine/**'
      - 'test/**'
      - 'db/**'
      - 'idl/**'
      - 'coordinator/internal/eventlog/generated/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/event-log.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flory
          POSTGRES_USER: flory
          POSTGRES_PASSWORD: flory-dev-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flory -d flory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run verify
